<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
  <title>Document</title>
  <style>

body {
  background-color: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.form-container {
  background: white;
  padding: 2.5rem;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgb(238, 217, 177); 
  max-width: 450px;
  width: 100%;
}

.input {
  border-radius: 8px;
  transition: all 0.3s ease;
}

.input:focus {
  border-color: #48c78e;
  box-shadow: 0 0 0 0.125em rgba(72, 199, 142, 0.25);
}

.button.is-primary {
  width: 100%;
  border-radius: 8px;
  font-weight: bold;
  margin-top: 1rem;
}

  </style>
  
</head>

<body>

  <div class="field">
    <label class="label"> Codigo del producto
      <div class="control">
        <input class="input" type="text" placeholder="Ingresa codigo">
      </div>


      <div class="field">
        <label class="label">Nombre del producto</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingresa nombre">
        </div>
      </div>


      <div class="field">
        <label class="label">Cantidad de productos</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese la cantidad">
        </div>
      </div>


      <div class="field">
        <label class="label">Marca del producto</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese marca">
        </div>
      </div>

<div class="control">
  <button class="button is-primary">Enviar</button>
</div>

</body>

</html>
