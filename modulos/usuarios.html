<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
  <link rel="stylesheet" href="../css/usuarios.css" />
  <title>Document</title>
</head>

<body>
  <div class="card form-card">
    <div class="form-header">
      <h1>USUARIOS</h1>
    </div>

    <div class="card-content">

      <div class="field">
        <label class="label" for="nombre">Nombre</label>
        <input class="input" type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        <span class="icon is-small is-left">
          <i class="fas fa-user"></i>
        </span>
      </div>

      <div class="field">
        <label class="label" for="apellido">Apellido</label>
        <input class="input" type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
        <span class="icon is-small is-left">
          <i class="fas fa-user-tag"></i>
        </span>
      </div>

      <div class="field">
        <label class="label" for="tipo_documento">Tipo de documento</label>
        <div class="select is-fullwidth">
          <select id="tipo_documento" required>
            <option value="" disabled selected>Seleccione tipo</option>
            <option value="CC">Cédula de Ciudadanía</option>
            <option value="TI">Tarjeta de Identidad</option>
            <option value="TE">Tarjeta de Extranjería</option>
            <option value="PAS">Pasaporte</option>
          </select>
        </div>
        <span class="icon is-small is-left">
          <i class="fas fa-id-card"></i>
        </span>
      </div>

      <div class="field">
        <label class="label" for="num_documento">Número de Documento</label>
        <input class="input" type="text" id="num_documento" name="num_documento" placeholder="Número de identificación" required>
        <span class="icon is-small is-left">
          <i class="fas fa-hashtag"></i>
        </span>
      </div>

      <div class="field">
        <label class="label" for="telefono">Teléfono</label>
        <input class="input" type="tel" id="telefono" name="telefono" placeholder="Número de contacto" required>
        <span class="icon is-small is-left">
          <i class="fas fa-phone"></i>
        </span>
      </div>

      <div class="field">
        <label class="label" for="correo">Correo</label>
        <input class="input" type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
        <span class="icon is-small is-left">
          <i class="fas fa-envelope"></i>
        </span>
      </div>

      <div class="field">
        <label class="label">Género</label>
        <div class="control radio-group">
          <label class="radio">
            <input type="radio" name="genero" value="Masculino" required> Masculino
          </label>
          <label class="radio">
            <input type="radio" name="genero" value="Femenino"> Femenino
          </label>
          <label class="radio">
            <input type="radio" name="genero" value="Otro"> Otro
          </label>
        </div>
      </div>

      <div class="field">
        <label class="label" for="cargo">Cargo</label>
        <input class="input" type="text" id="cargo" name="cargo" placeholder="Puesto de trabajo" required>
        <span class="icon is-small is-left">
          <i class="fas fa-briefcase"></i>
        </span>
      </div>

      <div class="field">
        <label class="label" for="fecha_nacimiento">Fecha de nacimiento</label>
        <input class="input" type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        <span class="icon is-small is-left">
          <i class="fas fa-calendar-alt"></i>
        </span>
      </div>

      <div class="field">
        <label class="label" for="contraseña">Contraseña</label>
        <input class="input" type="password" id="contraseña" name="contraseña" placeholder="********" required>
        <span class="icon is-small is-left">
          <i class="fas fa-lock"></i>
        </span>
      </div>

      <div class="buttons-container">
        <div class="control control-registrar">
          <button type="submit" class="button btn-enviar is-fullwidth" id="Guardar">Registrar</button>
        </div>
        <div class="control control-inicio">
          <a href="../index.html" class="button btn-inicio is-fullwidth">
            VOLVER A PÁGINA DE INICIO
          </a>
        </div>
      </div>

      </form>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/usuarios.js"></script>
</body>
</html>
